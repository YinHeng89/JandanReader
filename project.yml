name: JandanReader
options:
  bundleIdPrefix: com.yinheng
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_TESTABILITY: YES
targets:
  JandanReader:
    type: application
    platform: iOS
    sources:
      - path: JandanReader
        excludes:
          - "**/Info.plist"
    info:
      path: JandanReader/Info.plist
      properties:
        CFBundleDisplayName: 煎蛋
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yinheng.JandanReader
        # 与已提交的 pbxproj 保持一致；旧值 QQ9F8WHWZQ 会让 xcodegen 重新生成后签名失败。
        DEVELOPMENT_TEAM: PGRMM8LGUV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
  JandanReaderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JandanReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yinheng.JandanReaderTests
        DEVELOPMENT_TEAM: PGRMM8LGUV
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JandanReader.app/JandanReader"
        BUNDLE_LOADER: "$(TEST_HOST)"
